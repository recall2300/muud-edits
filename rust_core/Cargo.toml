[package]
name = "muud-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "muud-edits core: timeline model, edit commands (undo/redo), project persistence and export planning"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "muud_core"
# `cdylib` + `staticlib` are what flutter_rust_bridge links against.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
